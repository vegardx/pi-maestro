# Pull-request checks. The main-branch run lives in release.yml, which runs
# the same check before tagging a release.
#
# Runs on PRs to ANY base (not just main) so stacked PRs are checked, and on
# push to feat/** so a branch is checked even before its PR exists. Previously
# this only triggered on PRs into main, so an entire stacked cutover shipped
# with only its root PR ever running `npm run check`.
name: CI

on:
  pull_request:
  push:
    branches: ["main", "feat/**"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: pi-maestro
      # The seat depends on @vegardx/pi-subagent through a file: link to the
      # sibling checkout (see package.json), so CI builds that sibling at the
      # pinned commit before installing here. Raise the ref with the pin.
      - uses: actions/checkout@v7
        with:
          repository: vegardx/pi-subagent
          ref: 0ae4c106b4235d8576bde75a23896ba413bcf88e
          path: pi-subagent
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            pi-maestro/package-lock.json
            pi-subagent/package-lock.json
      - run: npm ci
        working-directory: pi-subagent
      - run: npm run build
        working-directory: pi-subagent
      - run: npm ci
        working-directory: pi-maestro
      # biome -> tsc -> feature-flag contract -> docs -> vitest -> smoke
      - run: npm run check
        working-directory: pi-maestro
